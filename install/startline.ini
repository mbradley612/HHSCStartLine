[Lights]
enabled=Y
comPort=/dev/ttyUSB0

[Audio]
gun=/opt/HHSCStartLine/media/1.5-Second-Horn-left.wav
warning=/opt/HHSCStartLine/media/beep-right.wav
startgun=/opt/HHSCStartLine/media/1.5-Second-Horn-left.wav
finishgun=/opt/HHSCStartLine/media/1.5-Second-Horn-left.wav

[Training]
trainingMode=N
trainingSpeed=5

[UserInterface]
backgroundColour=SkyBlue3
fullScreen=Y
fontSize=16
defaultFleetNames=Large handicap,Small handicap,Toppers,Large and small handicap,Teras,Oppies

[Logging]
configFilename=/opt/HHSCStartLine/logging.conf

[Persistence]
recoveryFilename=/var/startline/currentRace.dmp
